[package]
name = "mydupfinder-ui"
description = "Native GPUI viewer for myDupFinder dupReport.csv files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dupreport-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
smol.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Installer packaging with cargo-packager (`cargo packager --release -p mydupfinder-ui`).
# Paths are relative to this crate's directory. Version, description and
# authors come from the package; the binary is the crate's only bin target.
# The formats are chosen per OS on the command line (see README / CI).
[package.metadata.packager]
product-name = "myDupFinder UI"
identifier = "ch.rogerbriggen.mydupfinderui"
category = "Utility"
long-description = "Read-only desktop viewer for the dupReport.csv files produced by myDupFinder: browse the report as a folder tree, filter it and find completely identical folders."
out-dir = "../../target/packager"
binaries-dir = "../../target/release"
before-packaging-command = "cargo build --release --locked -p mydupfinder-ui"
binaries = [{ path = "mydupfinder-ui", main = true }]
icons = [
  "../../assets/icons/32x32.png",
  "../../assets/icons/128x128.png",
  "../../assets/icons/128x128@2x.png",
  "../../assets/icons/icon.icns",
  "../../assets/icons/icon.ico",
]

[package.metadata.packager.deb]
# Runtime libraries GPUI loads. "a | b" alternatives are written verbatim into
# the control file (libasound2 was renamed libasound2t64 on Ubuntu 24.04 / Debian 13).
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libvulkan1",
  "libfontconfig1",
  "libfreetype6",
  "libx11-xcb1",
  "libxcb1",
  "libasound2t64 | libasound2",
]
