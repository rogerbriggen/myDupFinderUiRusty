version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # GPUI crates must move together and are tested by hand.
      gpui:
        patterns:
          - "gpui"
          - "gpui-*"
          - "gpui_*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
