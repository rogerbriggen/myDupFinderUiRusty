name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run on any branch (Actions tab → CI → "Run workflow", or
  # `gh workflow run ci.yml --ref <branch> -f macos=true`). Pick the OSes.
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux: clippy + test + binary"
        type: boolean
        default: true
      windows:
        description: "Windows: clippy + test + binary"
        type: boolean
        default: true
      macos:
        description: "macOS: clippy + test + binary"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Gating (see docs/REBUILD_RUST_GPUI.md section 10.1):
#   Linux   - pull requests, main, tags
#   Windows - main, tags
#   macOS   - tags only
# A manual run (workflow_dispatch) runs exactly the OSes ticked in its inputs.
#
# Every OS job uploads its release binary as a workflow artifact
# (`mydupfinder-ui-<os>-<arch>`, kept 14 days). These are plain, unsigned
# executables, not installers. Not on pull requests: the release build would
# make the PR check about 5 minutes slower. Need a binary from a PR branch?
# Start a manual run on that branch.
#
# TODO (step 12): add package jobs (cargo-packager: .deb/.AppImage, .exe/.msi,
# .app/.dmg) that depend on these jobs, and a release job for `v*` tags using
# softprops/action-gh-release.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  test-linux:
    name: Clippy + test (Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-linux-x64
          path: target/release/mydupfinder-ui
          if-no-files-found: error
          retention-days: 14

  test-windows:
    name: Clippy + test (Windows)
    if: (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-windows-x64
          path: target/release/mydupfinder-ui.exe
          if-no-files-found: error
          retention-days: 14

  test-macos:
    name: Clippy + test (macOS)
    if: (github.event_name == 'workflow_dispatch' && inputs.macos) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-macos-arm64
          path: target/release/mydupfinder-ui
          if-no-files-found: error
          retention-days: 14
