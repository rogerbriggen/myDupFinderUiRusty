name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run on any branch: Actions tab → CI → "Run workflow", tick the OSes.
  # All three inputs default to true, so on the command line switch off the
  # ones you do not want, e.g. macOS only:
  #   gh workflow run ci.yml --ref <branch> -f linux=false -f windows=false
  # (`-f macos=true` alone would still run all three.)
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux: clippy + test + binary + packages"
        type: boolean
        default: true
      windows:
        description: "Windows: clippy + test + binary + packages"
        type: boolean
        default: true
      macos:
        description: "macOS: clippy + test + binary + packages"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Gating (see docs/REBUILD_RUST_GPUI.md section 10.1):
#   Linux   - pull requests, main, tags
#   Windows - main, tags
#   macOS   - tags only
# A manual run (workflow_dispatch) runs exactly the OSes ticked in its inputs.
#
# Packaging and release (docs/REBUILD_RUST_GPUI.md section 10.2 / 10.3):
#   package-<os> - needs test-<os>, runs on the same events except pull
#                  requests (main, tags, manual runs with that OS ticked).
#                  Builds installers with cargo-packager and uploads them as
#                  `mydupfinder-ui-<os>-packages` (14 days):
#                    Linux   .deb + .AppImage
#                    Windows NSIS setup .exe
#                    macOS   .dmg (contains the .app)
#   release      - only for `v*` tags, needs all three package jobs. Checks
#                  that the tag matches the workspace version, then attaches
#                  the installers to a GitHub Release with generated notes.
#
# Additionally every test job uploads its bare release binary
# (`mydupfinder-ui-<os>-<arch>`, kept 14 days): a plain, unsigned executable
# for quick tests. Not on pull requests: the release build would make the PR
# check about 5 minutes slower. Need a binary or installer from a PR branch?
# Start a manual run on that branch.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  test-linux:
    name: Clippy + test (Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libssl-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-linux-x64
          path: target/release/mydupfinder-ui
          if-no-files-found: error
          retention-days: 14

  test-windows:
    name: Clippy + test (Windows)
    if: (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-windows-x64
          path: target/release/mydupfinder-ui.exe
          if-no-files-found: error
          retention-days: 14

  test-macos:
    name: Clippy + test (macOS)
    if: (github.event_name == 'workflow_dispatch' && inputs.macos) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Binaries only for main, tags and manual runs - PR checks stay fast.
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p mydupfinder-ui
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-macos-arm64
          path: target/release/mydupfinder-ui
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package (Linux)
    needs: test-linux
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libssl-dev libasound2-dev
      # AppImage tooling (linuxdeploy) needs FUSE and `file`; the env var above
      # makes AppImages extract and run without FUSE as a fallback.
      - name: Install AppImage tooling
        run: |
          sudo apt-get install -y --no-install-recommends file
          sudo apt-get install -y --no-install-recommends libfuse2t64 || sudo apt-get install -y --no-install-recommends libfuse2
      # rust-cache first: post steps run in reverse order, and its cleanup
      # deletes bin/ entries that existed before it ran, so it must not see
      # cargo-packager as pre-existing before actions/cache saves it.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        id: packager-cache
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8
      # The before-packaging command in crates/mydupfinder-ui/Cargo.toml builds
      # the release binary first.
      - run: cargo packager --release -p mydupfinder-ui --formats deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-linux-packages
          path: |
            target/packager/*.deb
            target/packager/*.AppImage
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Package (Windows)
    needs: test-windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # rust-cache first: post steps run in reverse order, and its cleanup
      # deletes bin/ entries that existed before it ran, so it must not see
      # cargo-packager as pre-existing before actions/cache saves it.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        id: packager-cache
        with:
          path: ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8
      # NSIS is downloaded by cargo-packager itself (no NSIS/WiX install needed).
      - run: cargo packager --release -p mydupfinder-ui --formats nsis
      - uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-windows-packages
          path: |
            target/packager/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package (macOS)
    needs: test-macos
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain + components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # rust-cache first: post steps run in reverse order, and its cleanup
      # deletes bin/ entries that existed before it ran, so it must not see
      # cargo-packager as pre-existing before actions/cache saves it.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        id: packager-cache
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8
      # The dmg format builds the .app first and wraps it.
      - run: cargo packager --release -p mydupfinder-ui --formats dmg
      - uses: actions/upload-artifact@v7
        with:
          name: mydupfinder-ui-macos-packages
          path: |
            target/packager/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [fmt, package-linux, package-windows, package-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the workspace version
        run: |
          version=$(awk -F'"' '/^[[]workspace.package[]]/{f=1;next} /^[[]/{f=0} f && /^version *=/{print $2; exit}' Cargo.toml)
          echo "Cargo.toml version: '$version', tag: '$GITHUB_REF_NAME'"
          if [ -z "$version" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version v$version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: mydupfinder-ui-*-packages
          path: dist
          merge-multiple: true
      - run: ls -lR dist
      # The installers are attached as they are (a zip would hide them).
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          # A SemVer pre-release tag (v0.2.0-alpha.1) is published as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
